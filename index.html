<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiji Campus Bus & Weather Dashboard</title>

<style>
    /* General page styling */
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f8fb;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #005b96;
    }

    .card {
        background: #eef6ff;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
    }

    label {
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }

    button {
        background-color: #0078d4;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #005fa3;
    }

    #result {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
    }

    .weather-box {
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Fiji Campus Bus & Weather Dashboard</h1>

    <!-- Bus Fare Calculator -->
    <div class="card">
        <h2>Bus Fare Calculator</h2>

        <label for="budget">Enter Bus Fare Budget (FJD):</label>
        <input type="number" id="budget" placeholder="e.g. 10">

        <button onclick="calculateRides()">Calculate Rides</button>

        <!-- Calculation result or error message appears here -->
        <div id="result"></div>
    </div>

    <!-- Weather Forecast -->
    <div class="card">
        <h2>Today's Weather in Suva</h2>

        <div class="weather-box" id="weather">
            Loading weather forecast...
        </div>
    </div>
</div>

<script>
    /*
      Function to calculate the maximum number
      of bus rides a student can afford.
      Assumes each ride costs FJD $1.50.
    */
    function calculateRides() {
        const farePerRide = 1.50;

        // Get input value
        const budgetInput = document.getElementById("budget").value;
        const budget = parseFloat(budgetInput);

        // Check if input is empty, invalid, zero, or negative
        if (budgetInput.trim() === "" || isNaN(budget) || budget <= 0) {
            document.getElementById("result").textContent =
                "Please enter a valid positive dollar amount.";
            document.getElementById("result").style.color = "red";
            return;
        }

        // Calculate affordable rides
        const rides = Math.floor(budget / farePerRide);

        // Display result
        document.getElementById("result").textContent =
            `You can afford ${rides} bus ride(s).`;
        document.getElementById("result").style.color = "green";
    }

    /*
      Sample weather forecast for Suva.
      This can later be replaced with a real API.
    */
    const weatherForecast = {
        city: "Suva",
        condition: "Partly Cloudy",
        temperature: 28,
        humidity: 78
    };

    // Display weather information
    document.getElementById("weather").innerHTML = `
        <strong>Location:</strong> ${weatherForecast.city}<br>
        <strong>Condition:</strong> ${weatherForecast.condition}<br>
        <strong>Temperature:</strong> ${weatherForecast.temperature}°C<br>
        <strong>Humidity:</strong> ${weatherForecast.humidity}%
    `;
</script>

</body>
</html>
